name: Windows Build & Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      PYTHON_VERSION: '3.11'
      NODE_VERSION: '18'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Show repo tree (debug)
        run: |
          # PowerShell biçimi; çalıştığın repository root içeriğini listeler
          Get-ChildItem -Force -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1000

      - name: Install Python deps and Nuitka
        run: |
          python -m pip install --upgrade pip
          # requirements.txt repo kökündeyse bu path doğrudur
          if (Test-Path .\requirements.txt) {
            pip install -r requirements.txt
          } else {
            Write-Host "requirements.txt bulunamadı; gerekiyorsa path'i kontrol et."
          }
          pip install nuitka cython
        shell: powershell

      - name: Build backend with Nuitka (Windows standalone onefile)
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: |
          $out = Join-Path $PWD "artifacts\backend"
          if (-Not (Test-Path $out)) { New-Item -ItemType Directory -Path $out | Out-Null }
          # api\main.py repo kökünde api\main.py varsa doğru. Yoksa path'i düzelt.
          if (-Not (Test-Path ".\api\main.py")) {
            Write-Host "Warning: .\api\main.py bulunamadı. Lütfen backend giriş yolunu kontrol et."
            exit 1
          }
          nuitka --standalone --onefile --windows-disable-console .\api\main.py --output-dir=$out

      - name: Build frontend (React) and obfuscate
        working-directory: web_panel
        shell: powershell
        run: |
          npm ci
          npm run build
          # javascript-obfuscator yüklü değilse npx kullan
          npx javascript-obfuscator build\static\js --output build\static\js --compact true --control-flow-flattening true --dead-code-injection true --string-array true --string-array-rotate true --string-array-shuffle true
          # remove source maps if any
          Get-ChildItem -Path build -Include *.map -Recurse | Remove-Item -Force

      - name: Collect frontend artifact
        shell: powershell
        run: |
          $repo = "${{ github.workspace }}"
          $src = Join-Path $repo "web_panel\build"
          $dest = Join-Path $repo "artifacts\frontend\build"
          if (-Not (Test-Path $src)) {
            Write-Host "ERROR: frontend build not found at $src"
            exit 1
          }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          robocopy $src $dest /E
          if ($LASTEXITCODE -le 3) {
            # robocopy 0–3 normal kabul edilir
            Write-Host "Robocopy completed with exit code $LASTEXITCODE (success)"
            exit 0
          } else {
            Write-Host "Robocopy failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-artifacts
          path: artifacts
