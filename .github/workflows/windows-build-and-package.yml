name: Windows Build & Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      PYTHON_VERSION: '3.11'
      NODE_VERSION: '18'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Show repo tree (debug)
        run: |
          # PowerShell biçimi; çalıştığın repository root içeriğini listeler
          Get-ChildItem -Force -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1000
        shell: powershell

      - name: Install Python deps and Nuitka
        run: |
          python -m pip install --upgrade pip
          # requirements.txt repo kökündeyse bu path doğrudur
          if (Test-Path .\requirements.txt) {
            pip install -r requirements.txt
          } else {
            Write-Host "requirements.txt bulunamadı; gerekiyorsa path'i kontrol et."
          }
          pip install nuitka cython
        shell: powershell

      - name: Install Dependency Walker (offline fallback for Nuitka)
        shell: powershell
        run: |
          # Bu adım mümkünse Dependency Walker'ı Nuitka'nın cache dizinine indirip açar,
          # böylece Nuitka interaktif indirme istemez. Eğer indirme engellenirse adım hatası verebilir,
          # ancak yine de --assume-yes-for-downloads ile devam etmeye çalışacağız.
          $cache = Join-Path $env:LOCALAPPDATA "Nuitka\Nuitka\Cache\depends\x86_64"
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          $zip = Join-Path $cache "depends.zip"
          try {
            $dl = "http://dependencywalker.com/depends22_x64.zip"
            Write-Host "Downloading Dependency Walker from $dl ..."
            Invoke-WebRequest -Uri $dl -OutFile $zip -UseBasicParsing -ErrorAction Stop
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $cache)
            Remove-Item $zip -Force
            Write-Host "Dependency Walker extracted to $cache"
            # Ensure cache folder is on PATH
            $env:PATH = "$cache;$env:PATH"
          } catch {
            Write-Host "Warning: Dependency Walker download/extract failed. Will still try Nuitka with --assume-yes-for-downloads."
          }
        timeout-minutes: 10

      - name: Build backend with Nuitka (Windows standalone onefile)
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: |
          $out = Join-Path $PWD "artifacts\backend"
          if (-Not (Test-Path $out)) { New-Item -ItemType Directory -Path $out | Out-Null }
          # api\main.py repo kökünde api\main.py varsa doğru. Yoksa path'i düzelt.
          if (-Not (Test-Path ".\api\main.py")) {
            Write-Host "Warning: .\api\main.py bulunamadı. Lütfen backend giriş yolunu kontrol et."
            exit 1
          }
          # --windows-console-mode=disable replaces deprecated --windows-disable-console
          # --assume-yes-for-downloads makes Nuitka non-interactive for dependency walker download
          nuitka --standalone --onefile --windows-console-mode=disable --assume-yes-for-downloads .\api\main.py --output-dir=$out
        timeout-minutes: 30

      - name: Build frontend (React) and obfuscate
        working-directory: web_panel
        shell: powershell
        run: |
          npm ci
          npm run build
          # javascript-obfuscator yüklü değilse npx kullan
          npx javascript-obfuscator build\static\js --output build\static\js --compact true --control-flow-flattening true --dead-code-injection true --string-array true --string-array-rotate true --string-array-shuffle true
          # remove source maps if any
          Get-ChildItem -Path build -Include *.map -Recurse | Remove-Item -Force

      - name: Collect frontend artifact
        shell: powershell
        run: |
          $repo = "${{ github.workspace }}"
          $src = Join-Path $repo "web_panel\build"
          $dest = Join-Path $repo "artifacts\frontend\build"
          if (-Not (Test-Path $src)) {
            Write-Host "ERROR: frontend build not found at $src"
            exit 1
          }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          robocopy $src $dest /E
          if ($LASTEXITCODE -le 3) {
            # robocopy 0–3 normal kabul edilir
            Write-Host "Robocopy completed with exit code $LASTEXITCODE (success)"
            exit 0
          } else {
            Write-Host "Robocopy failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-artifacts
          path: artifacts
