version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - frontend

  frontend:
    build:
      context: ./web_panel
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./web_panel:/app
