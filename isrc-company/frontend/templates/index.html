<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Licensor lookup</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0e0e0e;
      --panel: rgba(255, 255, 255, 0.05);
      --text: #fefefe;
      --accent: #1db954;
      --error: #ff4d4d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      font-family: 'Montserrat', sans-serif;
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.2rem;
    }

    .tagline {
      font-size: 1.1rem;
      opacity: 0.8;
    }

    .badge {
      background-color: var(--accent);
      color: black;
      padding: 0.2em 0.6em;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-left: 0.5em;
    }

    .glass-panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 1.5rem;
      margin: 2rem 0;
      backdrop-filter: blur(10px);
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      background-color: #1e1e1e;
      color: white;
    }

    button {
      background-color: var(--accent);
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      color: black;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      margin-top: 2rem;
    }

    .spinner {
      border: 4px solid #333;
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-align: left;
      flex-wrap: wrap;
    }

    .track-info img {
      width: 100px;
      border-radius: 8px;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Spotify Track Analyzer</h1>
    <p class="tagline">Spotify track licensor / distributor lookup</p>

    <div class="glass-panel">
      <p>Enter a Spotify Track ID or URL</p>
      <div class="input-row">
        <input type="text" id="trackId" placeholder="e.g., 11dFghVXANMlKmJXsNCbNl or spotify.com/track/...">
        <button onclick="lookupLicensor()"><i class="fas fa-search"></i> Lookup</button>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Scanning track data...</p>
    </div>

    <div id="result" class="glass-panel hidden"></div>

    <div class="footer">
      <p>© Spotify Track Analyzer</p>
    </div>
  </div>

  <script>
    async function lookupLicensor() {
      const trackInput = document.getElementById('trackId').value.trim();
      const resultDiv = document.getElementById('result');
      const loadingDiv = document.getElementById('loading');

      resultDiv.innerHTML = '';
      resultDiv.classList.add('hidden');

      if (!trackInput) {
        alert('Please enter a track ID or URL.');
        return;
      }

      const trackId = extractTrackId(trackInput);
      if (!trackId) {
        alert('Invalid Track ID or URL');
        return;
      }

      loadingDiv.classList.remove('hidden');

      try {
        const response = await fetch(`/get_licensor?track_id=${trackId}`);
        const data = await response.json();
        loadingDiv.classList.add('hidden');
        resultDiv.classList.remove('hidden');

        if (data.error) {
          resultDiv.innerHTML = `<p style="color: var(--error);"><i class="fas fa-exclamation-circle"></i> ${data.error}</p>`;
        } else {
          resultDiv.innerHTML = `
            <div class="track-info">
              ${data.image_url ? `<img src="${data.image_url}" alt="Album Art">` : ''}
              <div>
                <p><strong>Song:</strong> ${data.name}</p>
                <p><strong>Distributor:</strong> ${data.licensor_name}</p>
                ${data.release_date ? `<p><strong>Released:</strong> ${data.release_date}</p>` : ''}
              </div>
            </div>`;
        }
      } catch (err) {
        loadingDiv.classList.add('hidden');
        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `<p style="color: var(--error);"><i class="fas fa-exclamation-triangle"></i> Network Error</p>`;
      }
    }

    function extractTrackId(input) {
      if (/^[a-zA-Z0-9]{22}$/.test(input)) return input;
      const match = input.match(/spotify\.com\/track\/([a-zA-Z0-9]{22})/);
      return match ? match[1] : null;
    }
  </script>
</body>
</html>
